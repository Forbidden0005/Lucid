name: Lucid Build & Test

on:
  push:
    branches: [ main, "phase-18c/**", "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-debug:
    name: Build Debug (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        working-directory: lucid-desktop
        run: dotnet restore Lucid.slnx -p:Platform=x64

      - name: Validate release metadata
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-metadata.ps1

      - name: Validate release operations policy
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-operations.ps1

      - name: Check Lucid.App source inclusion policy
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/check-app-source-includes.ps1

      - name: Build solution
        working-directory: lucid-desktop
        run: >
          dotnet build Lucid.slnx
          -c Debug
          -p:Platform=x64
          --no-restore

  test-debug:
    name: Unit Tests Debug (x64)
    runs-on: windows-latest
    needs: build-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        working-directory: lucid-desktop
        run: dotnet restore Lucid.slnx -p:Platform=x64

      - name: Run tests
        working-directory: lucid-desktop
        run: >
          dotnet test Lucid.Tests/Lucid.Tests.csproj
          -c Debug
          -p:Platform=x64
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-debug
          path: lucid-desktop/Lucid.Tests/TestResults/

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-debug
          path: "lucid-desktop/Lucid.Tests/TestResults/**/coverage.cobertura.xml"

  build-release:
    name: Build Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        working-directory: lucid-desktop
        run: dotnet restore Lucid.slnx -p:Platform=x64

      - name: Validate release metadata
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-metadata.ps1

      - name: Validate release operations policy
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-operations.ps1

      - name: Check Lucid.App source inclusion policy
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/check-app-source-includes.ps1

      - name: Build solution
        working-directory: lucid-desktop
        run: >
          dotnet build Lucid.slnx
          -c Release
          -p:Platform=x64
          --no-restore

  test-release:
    name: Unit Tests Release (x64)
    runs-on: windows-latest
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        working-directory: lucid-desktop
        run: dotnet restore Lucid.slnx -p:Platform=x64

      - name: Run tests
        working-directory: lucid-desktop
        run: >
          dotnet test Lucid.Tests/Lucid.Tests.csproj
          -c Release
          -p:Platform=x64
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-release
          path: lucid-desktop/Lucid.Tests/TestResults/

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-release
          path: "lucid-desktop/Lucid.Tests/TestResults/**/coverage.cobertura.xml"

  publish-release:
    name: Publish Release Artifact (win-x64)
    runs-on: windows-latest
    needs: test-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        working-directory: lucid-desktop
        run: dotnet restore Lucid.slnx -p:Platform=x64

      - name: Validate release metadata
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-metadata.ps1

      - name: Validate release operations policy
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/validate-release-operations.ps1

      - name: Publish unpackaged self-contained app
        working-directory: lucid-desktop
        run: >
          dotnet publish Lucid.App/Lucid.App.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          --no-restore

      - name: Sign release artifact
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/sign-release-artifact.ps1

      - name: Run release smoke
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/run-release-smoke.ps1

      - name: Prepare release artifact metadata and checksums
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/prepare-release-artifact.ps1

      - name: Verify prepared release artifact
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-release-artifact.ps1

      - name: Package release artifact
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/package-release-artifact.ps1

      - name: Verify release package
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-release-package.ps1

      - name: Generate release update manifest
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/generate-release-update-manifest.ps1

      - name: Verify release update manifest
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-release-update-manifest.ps1

      - name: Generate release update feed
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/generate-release-update-feed.ps1

      - name: Verify release update feed
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-release-update-feed.ps1

      - name: Verify installer round-trip
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-installer-roundtrip.ps1

      - name: Verify support bundle export
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/verify-support-bundle-export.ps1

      - name: Upload unpackaged release package
        uses: actions/upload-artifact@v7
        with:
          name: lucid-release-win-x64-unpackaged-package
          path: |
            release/packages/
